# Sirve la interfaz y reenvía /api al backend (mismo origen: la cookie de sesión funciona sin CORS).
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Modelos de reconocimiento facial: no cambian entre versiones.
  location /models/ {
    expires 30d;
  }

  # Aplicación de una sola página: toda ruta desconocida devuelve index.html.
  location / {
    try_files $uri /index.html;
  }
}
