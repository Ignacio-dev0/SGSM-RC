# Interfaz del SGSM-RC servida por nginx con HTTPS (T007, T802 · docs/despliegue.md).
#
# Es una PLANTILLA: al arrancar, la imagen oficial de nginx reemplaza ${HTTPS_PUERTO} (y solo esa
# variable: NGINX_ENVSUBST_FILTER en frontend/Dockerfile) y la deja en conf.d/default.conf.
# Reenvía /api a la API: mismo origen, así la cookie de sesión funciona sin CORS.

server_tokens off;

# DNS interno de Docker: con la API en una variable (location /api/), nginx vuelve a buscar su IP
# cuando el contenedor se recrea en una actualización, en vez de quedarse con la vieja.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket de recordatorios: "upgrade" cuando el navegador lo pide, conexión normal si no.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Puerto HTTPS que ve el navegador (el de la PC, no el del contenedor). Con 443 no se escribe.
map ${HTTPS_PUERTO} $sufijo_https {
  443 '';
  default :${HTTPS_PUERTO};
}

# HSTS solo con el nombre o la IP de la red. En localhost obligaría al navegador de esa PC a usar
# HTTPS en todos sus puertos (también en el servidor de desarrollo de Vite). Las IP ya las ignora.
map $host $hsts {
  localhost '';
  127.0.0.1 '';
  default 'max-age=31536000';
}

# HTTP: solo redirige a HTTPS y entrega el certificado PÚBLICO de la CA local para instalarlo en
# las tablets (la clave de la CA nunca se monta en este contenedor).
server {
  listen 80 default_server;

  location = /sgsm-ca.crt {
    alias /etc/nginx/certificados/sgsm-ca.crt;
    default_type application/x-x509-ca-cert;
  }

  location = /sgsm-ca.cer {
    alias /etc/nginx/certificados/sgsm-ca.cer;
    default_type application/x-x509-ca-cert;
  }

  location / {
    return 301 https://$host$sufijo_https$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;

  # Certificado del servidor firmado por la CA local (scripts/certificado.sh).
  ssl_certificate /etc/nginx/certificados/servidor.crt;
  ssl_certificate_key /etc/nginx/certificados/servidor.key;
  # Configuración "intermedia" de Mozilla: TLS 1.2 y 1.3, cifrados con secreto hacia adelante.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SGSM:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Alguien escribió http:// con el puerto HTTPS (497): se lo manda a https://.
  error_page 497 =301 https://$host$sufijo_https$request_uri;

  root /usr/share/nginx/html;
  client_max_body_size 2m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Los encabezados de seguridad de la interfaz (CSP, Permissions-Policy, HSTS…) están en
  # docker/nginx/seguridad.conf y se incluyen en cada location de la interfaz, no en /api/.

  location /api/ {
    set $api http://backend:3000;
    proxy_pass $api;
    # $http_host conserva el puerto (:8443): el backend compara el Origin del WebSocket con el Host,
    # así que no hace falta TIEMPO_REAL_ORIGENES.
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # La IP real de la tablet (límite de intentos del login por IP, CONFIAR_PROXY=1) y el esquema.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # La API pone sus propios encabezados (CSP default-src 'none', no-store…) y nginx no les
    # agrega los de la interfaz. Solo el HSTS se reemplaza por el de nginx, que no lo manda a
    # localhost: si no, el navegador de la PC servidor forzaría HTTPS en todos sus puertos.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security $hsts always;
    # Sin compresión en respuestas con datos de la sesión (ataques tipo BREACH).
    gzip off;
  }

  # Modelos de reconocimiento facial: no cambian entre versiones.
  location /models/ {
    include /etc/nginx/snippets/seguridad.conf;
    expires 30d;
  }

  # Archivos de Vite con el hash en el nombre: cada versión trae nombres nuevos.
  location /assets/ {
    include /etc/nginx/snippets/seguridad.conf;
    expires 1y;
  }

  # La página de entrada se revalida siempre, para que una versión nueva se vea enseguida.
  location = /index.html {
    include /etc/nginx/snippets/seguridad.conf;
    expires -1;
  }

  location = /sgsm-ca.crt {
    include /etc/nginx/snippets/seguridad.conf;
    alias /etc/nginx/certificados/sgsm-ca.crt;
    default_type application/x-x509-ca-cert;
  }

  location = /sgsm-ca.cer {
    include /etc/nginx/snippets/seguridad.conf;
    alias /etc/nginx/certificados/sgsm-ca.cer;
    default_type application/x-x509-ca-cert;
  }

  # Aplicación de una sola página: toda ruta desconocida devuelve index.html.
  location / {
    include /etc/nginx/snippets/seguridad.conf;
    try_files $uri /index.html;
  }
}
