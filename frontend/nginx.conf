# Sirve la interfaz y reenvía /api al backend (mismo origen: la cookie de sesión funciona sin CORS).

# WebSocket de recordatorios: "upgrade" cuando el navegador lo pide, conexión normal si no.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://backend:3000;
    # $http_host conserva el puerto (:8080): el backend compara el Origin del WebSocket con el Host.
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Modelos de reconocimiento facial: no cambian entre versiones.
  location /models/ {
    expires 30d;
  }

  # Aplicación de una sola página: toda ruta desconocida devuelve index.html.
  location / {
    try_files $uri /index.html;
  }
}
