# Integración continua (T012): formato, lint, tipos y pruebas de backend y frontend.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sgsm
          POSTGRES_PASSWORD: sgsm
          POSTGRES_DB: sgsm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sgsm -d sgsm_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verificar
