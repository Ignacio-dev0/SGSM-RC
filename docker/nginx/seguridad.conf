# Encabezados de seguridad de la INTERFAZ (T802 · docs/despliegue.md, bloque de docs/seguridad.md
# "Qué queda para el despliegue"). frontend/nginx.conf lo incluye en cada location de la interfaz
# y NO en /api/, que trae los suyos de la API (helmet: CSP default-src 'none', no-store…).
# Un add_header dentro de un location reemplaza a los heredados: por eso se incluye en cada uno.

# HTTPS obligatorio por un año (vacío en localhost: ver el map $hsts). Sin includeSubDomains: con
# un nombre del DNS del hospital alcanzaría a otros sistemas internos que quizás van por HTTP.
add_header Strict-Transport-Security $hsts always;

# - script-src: los archivos de la app y el script en línea del tema de index.html por su hash.
#   El marcador de abajo lo reemplaza frontend/Dockerfile al construir la imagen por el hash
#   calculado del index.html compilado (csp-scripts.mjs): si el script del tema cambia, el hash se
#   recalcula solo (hoy: 'sha256-EydXdSVb/MXm14YVRAlKnNE57dbQ99OQHQuncw00eMA=').
#   'wasm-unsafe-eval': TensorFlow.js (dentro de face-api) compila WebAssembly al cargar; sin esto
#   Chromium registra una violación. No habilita eval() ni new Function().
# - style-src 'unsafe-inline': MUI (emotion) inserta sus estilos en <style> al vuelo.
# - connect-src: /api, los modelos de /models (fetch) y el WebSocket del mismo origen; el wss://
#   explícito es para Safari viejos de iPad, que no cuentan ws/wss dentro de 'self'.
# - img-src data: blob:: la vista previa de la foto capturada y los gráficos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' __CSP_SCRIPTS__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$http_host; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# La cámara solo para la propia app (getUserMedia de la validación facial); nada más.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
# Sistema interno con datos clínicos: que ningún buscador lo indexe.
add_header X-Robots-Tag "noindex, nofollow" always;
